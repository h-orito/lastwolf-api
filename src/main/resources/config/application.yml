spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:4306/lastwolfdb?characterEncoding=UTF-8
    username: lastwolfuser # 本番は起動引数で与える
    password: lastwolfpass # 本番は起動引数で与える
    driver-class-name: com.mysql.cj.jdbc.Driver
  messages:
    basename: messages
    cache-duration: -1
    encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
security:
  corsClientUrls:
    - http://localhost:3000
server:
  port: 8088
  servlet:
    context-path: /lastwolf
    session:
      timeout: 86400
  compression:
    enabled: true
  forward-headers-strategy: native
  tomcat:
    remote-ip-header: x-forwarded-for
logging:
  level:
    org.springframework: INFO
    root: INFO
    org.seasar.dbflute: ERROR
  file:
    name: /var/log/lastwolf/tomcat.log
